name: CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: satoyama_test
          POSTGRES_USER: satoyama_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U satoyama_test -d satoyama_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://satoyama_test:ci-only-password@localhost:5432/satoyama_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize PostGIS
        run: docker exec -i ${{ job.services.postgres.id }} psql -U satoyama_test -d satoyama_test -f /dev/stdin < db/init/001-postgis.sql
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:check
