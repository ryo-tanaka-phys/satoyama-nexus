name: M1 selection spike
on:
  pull_request:
    paths:
      - 'scripts/m1-selection-spike.mjs'
      - '.github/workflows/m1-selection-spike.yml'
  push:
    branches: ['codex/m1-03-selection-spike']
permissions:
  contents: read
jobs:
  candidate-experiments:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: satoyama_spike
          POSTGRES_USER: satoyama_spike
          POSTGRES_PASSWORD: ci-only-spike
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U satoyama_spike -d satoyama_spike"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://satoyama_spike:ci-only-spike@localhost:5432/satoyama_spike
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated pinned candidates
        run: |
          export M1_SPIKE_DIR="$RUNNER_TEMP/m1-selection-spike"
          echo "M1_SPIKE_DIR=$M1_SPIKE_DIR" >> "$GITHUB_ENV"
          npm install --prefix "$M1_SPIKE_DIR" --ignore-scripts --save-exact drizzle-orm@0.44.7 @auth/core@0.41.1 pg@8.16.3
      - name: Run candidate experiments
        run: node scripts/m1-selection-spike.mjs
